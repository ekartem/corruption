<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corruption and Trust Dynamics</title>
  <style>
    :root {
      --bg: #f6f3ed;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #5f6b7a;
      --border: #ddd6c8;
      --accent: #8b3a2b;
      --accent-dark: #642519;
      --soft: #efe6d8;
      --shadow: 0 18px 45px rgba(31, 41, 51, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(139, 58, 43, 0.10), transparent 34rem),
        linear-gradient(180deg, #fbf8f2 0%, var(--bg) 100%);
    }

    main {
      width: min(760px, calc(100% - 32px));
      padding: 44px;
      background: rgba(255, 255, 255, 0.90);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(2.35rem, 6vw, 4rem);
      line-height: 1.04;
      letter-spacing: -0.045em;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    a.button:hover,
    a.button:focus {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      transform: translateY(-1px);
    }

    a.button.secondary {
      background: transparent;
      color: var(--accent);
    }

    a.button.secondary:hover,
    a.button.secondary:focus {
      background: var(--soft);
      color: var(--accent-dark);
    }

    @media (max-width: 560px) {
      body {
        align-items: flex-start;
      }

      main {
        margin-top: 24px;
        padding: 28px;
        border-radius: 18px;
      }

      nav {
        flex-direction: column;
      }

      a.button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Agent-based model · NetLogo Web</p>
    <h1>Corruption and Trust Dynamics</h1>

    <nav aria-label="Site files">
      <a class="button" href="corruption_trust_dynamics_004_web.html">Run the model</a>
      <a class="button secondary" href="Corruption_Trust_Dynamics_v004_with_figures.html">English description</a>
      <a class="button secondary" href="Corruption_Trust_Dynamics_v004_with_figures_UA.html" lang="uk">Український опис</a>
    </nav>
  </main>
</body>
</html>
